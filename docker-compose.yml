services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracepay_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    env_file:
      - ./frontend/.env.local
    container_name: tracepay_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
